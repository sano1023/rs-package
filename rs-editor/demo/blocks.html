<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rs-editor 自動目次とボックス</title>
<link rel="stylesheet" href="../dist/rs-editor.css">
<style>
body { margin:0; background:#f3f6fa; color:#172033; font:16px/1.7 system-ui,sans-serif; }
main { max-width:900px; padding:32px 18px 120px; margin:auto; } h1 { font-size:30px; margin-bottom:8px; }
.lead { color:#526176; margin-bottom:24px; } .actions { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
.actions button { border:1px solid #b9c6d6; border-radius:8px; padding:10px 16px; background:white; font:inherit; cursor:pointer; }
.rse-content { min-height:380px; } #preview { padding:24px; background:white; border:1px solid #cbd5e1; border-radius:10px; }
#status { color:#526176; font-size:14px; } .rse-content h2,.rse-content h3 { scroll-margin-top:70px; }
@media(max-width:600px) { main { padding-top:16px; } h1 { font-size:25px; } }
</style>
<main>
<h1>自動目次とボックス</h1>
<p class="lead">見出しを直すと目次も更新されます。文章を選んでボックスで囲み、見た目を選んでみてください。</p>
<textarea id="editor"><h1>読みやすい記事をつくる</h1><p>これは導入文です。目次は、この導入文と最初の大見出しの間に入ります。</p><h2>準備する</h2><p>必要な情報を集め、文章の流れを整理します。</p><h3>情報を集める</h3><p>伝えたいことを箇条書きにしてみましょう。</p><h3>構成を考える</h3><p>大見出しと小見出しで話題を整理します。</p><h2>記事を書く</h2><p>この段落と次の段落を選択すると、まとめてボックスで囲めます。</p><p>ボックス内でも文章やリスト、画像を編集できます。</p></textarea>
<div class="actions"><button id="save">保存して開き直す</button><button id="show">公開表示を確認</button><button id="layout">ツールバーを切り替える</button></div>
<p id="status" role="status">「目次」から挿入、「ボックス」から見本を選べます。</p>
<div id="preview" hidden></div>
</main>
<script type="module">
import {createRSEditor} from '../dist/esm/index.js';
import {toc} from '../dist/esm/plugins/toc.js';
import {box} from '../dist/esm/plugins/box.js';
const editor=createRSEditor('#editor',{plugins:[toc,box],toolbar:'undo redo | h2 h3 | bold italic | bullist numlist | image | toc box | code',floatingToolbar:false});
window.editor=editor;
const status=document.querySelector('#status'),preview=document.querySelector('#preview');
document.querySelector('#save').onclick=()=>{const html=editor.getHTML();editor.setHTML(html);status.textContent='本文・目次・ボックスを保存した HTML から復元しました。';};
document.querySelector('#show').onclick=()=>{preview.innerHTML=editor.getHTML();preview.hidden=!preview.hidden;status.textContent=preview.hidden?'公開表示を閉じました。':'この下が保存された HTML の公開表示です。';};
let compact=false;document.querySelector('#layout').onclick=()=>{compact=!compact;editor.setToolbar(compact?'undo redo | toc box':'undo redo | h2 h3 | bold italic | bullist numlist | image | toc box | code');};
</script>
</html>
